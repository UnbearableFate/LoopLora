# B3/B4/B5/B5-lin/M1/M1-lin/B8 use the same fixed oracle codebook and episodes.
# B6/B7 use joint training as capacity controls, not paired writer controls.
- name: t1-B3
  config: smoke_base.yaml
  overrides: {variant: B3, task: {name: t1, chain_lengths: null, hops: [1]}}
- name: t1-B4
  config: smoke_base.yaml
  overrides: {variant: B4, task: {name: t1, chain_lengths: null, hops: [1]}}
- name: t1-B5
  config: smoke_base.yaml
  overrides: {variant: B5, task: {name: t1, chain_lengths: null, hops: [1]}}
- name: t1-B5-lin
  config: smoke_base.yaml
  overrides: {variant: B5-lin, task: {name: t1, chain_lengths: null, hops: [1]}}
- name: t1-M1
  config: smoke_base.yaml
  overrides: {variant: M1, task: {name: t1, chain_lengths: null, hops: [1]}}
- name: t1-M1-lin
  config: smoke_base.yaml
  overrides: {variant: M1-lin, task: {name: t1, chain_lengths: null, hops: [1]}}
- name: t1-B6
  config: smoke_base.yaml
  overrides: {variant: B6, writer: joint, model: {r: 96, r_mem: 96, reference_r: 64}, task: {name: t1, chain_lengths: null, hops: [1]}}
- name: t1-B7
  config: smoke_base.yaml
  overrides: {variant: B7, writer: joint, model: {r: 64, r_mem: 96, reference_r: 64}, task: {name: t1, chain_lengths: null, hops: [1]}}
- name: t1-B8
  config: smoke_base.yaml
  overrides: {variant: B8, task: {name: t1, chain_lengths: null, hops: [1]}}
- name: t2-B3
  config: smoke_base.yaml
  overrides: {variant: B3}
- name: t2-B4
  config: smoke_base.yaml
  overrides: {variant: B4}
- name: t2-B5
  config: smoke_base.yaml
  overrides: {variant: B5}
- name: t2-B5-lin
  config: smoke_base.yaml
  overrides: {variant: B5-lin}
- name: t2-M1
  config: smoke_base.yaml
  overrides: {variant: M1}
- name: t2-M1-lin
  config: smoke_base.yaml
  overrides: {variant: M1-lin}
- name: t2-B6
  config: smoke_base.yaml
  overrides: {variant: B6, writer: joint, model: {r: 96, r_mem: 96, reference_r: 64}}
- name: t2-B7
  config: smoke_base.yaml
  overrides: {variant: B7, writer: joint, model: {r: 64, r_mem: 96, reference_r: 64}}
- name: t2-B8
  config: smoke_base.yaml
  overrides: {variant: B8}
# Fixed-L=4 starts complement the fixed-L=1 B4 smoke; main readers remain mixed.
- name: t1-M1-L4
  config: smoke_base.yaml
  overrides:
    variant: M1
    task: {name: t1, chain_lengths: null, hops: [1]}
    train: {depths: [4]}
- name: t2-M1-L4
  config: smoke_base.yaml
  overrides: {variant: M1, train: {depths: [4]}}
# The six learned readers below depend on one exact pretrained writer artifact.
- name: t1-shared-writer
  config: smoke_base.yaml
  overrides:
    variant: B4
    writer: t1_frozen
    task: {name: t1, chain_lengths: null, hops: [1]}
- name: t2-frozen-B3
  config: smoke_base.yaml
  writer_from: t1-shared-writer
  overrides: {variant: B3, writer: t1_frozen}
- name: t2-frozen-B4
  config: smoke_base.yaml
  writer_from: t1-shared-writer
  overrides: {variant: B4, writer: t1_frozen}
- name: t2-frozen-B5
  config: smoke_base.yaml
  writer_from: t1-shared-writer
  overrides: {variant: B5, writer: t1_frozen}
- name: t2-frozen-B5-lin
  config: smoke_base.yaml
  writer_from: t1-shared-writer
  overrides: {variant: B5-lin, writer: t1_frozen}
- name: t2-frozen-M1
  config: smoke_base.yaml
  writer_from: t1-shared-writer
  overrides: {variant: M1, writer: t1_frozen}
- name: t2-frozen-M1-lin
  config: smoke_base.yaml
  writer_from: t1-shared-writer
  overrides: {variant: M1-lin, writer: t1_frozen}
