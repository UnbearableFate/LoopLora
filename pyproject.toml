[project]
name = "looplora"
version = "0.1.0"
description = "Iterative low-rank adaptation under a fixed context-memory budget (research code)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "torch==2.14.0+cu132",
  "transformers==4.57.6",
  "safetensors>=0.8",
  "numpy>=2.5",
  "pandas>=3.0",
  "pyyaml>=6.0",
  "matplotlib>=3.10",
  "pytest>=9.1",
  "pyarrow==21.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
